[package]
name = "crisol-ui"
description = "Umbrella crate re-exporting the Crisol UI engine (Track A) so it can be consumed standalone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["render"]
# The GPU renderer pulls in wgpu + winit. Downstream users embedding only the
# tree/layout/paint pipeline can turn it off.
render = ["dep:crisol-render-wgpu"]
# Reading this process's own memory, for reproducing the acceptance figure. Off by
# default: an embedder has no use for it, but the product's headline claim is a memory
# number and a claim nobody can re-run is not evidence. See `measure`.
measure = ["dep:mach2", "dep:windows-sys"]

[dependencies]
crisol-tree.workspace = true
crisol-dom.workspace = true
crisol-reactive.workspace = true
crisol-html.workspace = true
crisol-css.workspace = true
crisol-style.workspace = true
crisol-layout.workspace = true
crisol-text.workspace = true
crisol-paint.workspace = true
crisol-events.workspace = true
crisol-a11y.workspace = true
crisol-display-list.workspace = true
crisol-render-wgpu = { workspace = true, optional = true }
# Just an enum, no platform code — the vocabulary winit and every other windowing
# crate already speak, so the mapping below produces the type they want.
cursor-icon.workspace = true

# Only for the `measure` feature. `mach2` is bindings and nothing else — no dependencies
# of its own — and it is preferred to hand-declaring the structs because `task_vm_info` is
# `repr(C, packed(4))`: a hand-rolled `repr(C)` copy would differ in alignment and could
# report the wrong field without ever failing. `libc`'s mach bindings are deprecated in
# favour of exactly this crate.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
mach2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The example touches wgpu and winit types directly, which the engine does not re-export:
# nothing above the renderer should need them.
wgpu.workspace = true
winit.workspace = true
# Native menus for the example, and a dev-dependency for the same reason winit is one:
# nothing above the renderer should need a windowing crate, and a menu bar is shell rather
# than document. `default-features = false` drops GTK and libxdo, which are Linux-only and
# which this engine does not otherwise pull in.
muda = { version = "0.20", default-features = false }

[[example]]
name = "tree"
required-features = ["render"]

[[example]]
name = "todo"
required-features = ["render"]

[[example]]
name = "windows"
required-features = ["render"]

[[example]]
name = "bigresponse"
required-features = ["measure"]
