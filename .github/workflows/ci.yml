name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
          - name: Linux (x86_64)
            os: ubuntu-latest
          - name: Windows (x86_64)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # winit/wgpu need the X11, Wayland and xkbcommon headers to build on Linux.
      # Mesa's lavapipe gives us a software Vulkan device so renderer tests are not
      # skipped on a headless runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev mesa-vulkan-drivers vulkan-tools \
            fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Without these, a machine missing a GPU adapter or a font *skips* the tests that
          # need them, and a run where everything skipped is indistinguishable from a run
          # where everything passed. Linux gets its adapter from the lavapipe software
          # rasteriser and its fonts from the package installed above.
          CRISOL_REQUIRE_GPU: 1
          CRISOL_REQUIRE_FONTS: 1

      # `cargo test` builds examples but never runs them, so the interaction paths — key
      # handling, selection, the edit/commit cycle — would compile on three platforms and be
      # executed on none. The headless mode needs no window and no adapter.
      - name: Run the example headless
        # `measure` is added here and nowhere else: it is off by default because an embedder
        # has no use for it, but this is the run that produces the acceptance figure, and CI
        # is the only place all three platforms are available.
        #
        # The reading goes to the job summary rather than only to the log. M8's acceptance is
        # a memory number the product claim rests on, and a number nobody can find without
        # opening three logs and scrolling is not a defensible one.
        #
        # Deliberately not gated on a ceiling yet: the macOS figure is known and the other two
        # are not, and a bound picked before seeing the numbers it bounds is how D-49's
        # tolerance came to be wider than the thing it was checking. Watch these, then set it.
        shell: bash
        run: |
          set -euo pipefail
          output=$(cargo run -p crisol-ui --example todo --features measure -- --headless)
          echo "$output"
          # `|| true` because `pipefail` would otherwise turn a missing line into a failed
          # step, and the run itself is what this step exists to check. A reading that does
          # not appear should say so in the summary rather than look like a broken build.
          reading=$(grep -F 'memory after the scripted run' <<<"$output" | sed 's/.*run: //' || true)
          # One job, one summary, so this is a line rather than a row in a table that
          # would have no header to render against.
          echo "**$PLATFORM** idle memory: ${reading:-no reading}" >> "$GITHUB_STEP_SUMMARY"
        env:
          CRISOL_REQUIRE_FONTS: 1
          # Through the environment rather than interpolated into the script. These values
          # are the workflow's own literals today, so this is hygiene rather than a fix —
          # it is what keeps the step safe if the matrix ever grows a computed entry.
          PLATFORM: ${{ matrix.name }}

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Mobile is in scope from M1 per ROADMAP §3.6 even though the ports ship at M22.
  # Checking the arm64 mobile targets on every commit is what keeps that honest: a
  # desktop-only assumption fails here the day it is introduced, not at M22.
  mobile-targets:
    name: Mobile target check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            runner: macos-latest
          - target: aarch64-linux-android
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add target
        # Not the setup action's `targets:` input: that installs the target for `stable`,
        # while `rust-toolchain.toml` pins the toolchain cargo actually uses. `rustup target
        # add` here resolves against the pinned toolchain, which is the one that needs it.
        run: rustup target add ${{ matrix.target }}

      # GameActivity (DECISIONS D-16) compiles C++ glue, so an Android build needs the NDK's
      # cross compiler and not just the Rust target. The NDK is preinstalled on the runner;
      # `cc-rs` just cannot find it without being told where.
      - name: Point the C toolchain at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ]; then
            echo "::error::No Android NDK on this runner (ANDROID_NDK_LATEST_HOME unset)."
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # API 26 is a build-time header level, not a shipping decision: Vulkan needs 24+,
          # and the real minSdk is settled at M22 when there is something to ship.
          cc="$bin/aarch64-linux-android26-clang"
          if [ ! -x "$cc" ]; then
            echo "::error::$cc is missing. Available wrappers:"
            ls "$bin" | grep -E '^aarch64-linux-android[0-9]+-clang$' || true
            exit 1
          fi
          {
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=${cc}++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}
