name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
          - name: Linux (x86_64)
            os: ubuntu-latest
          - name: Windows (x86_64)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # winit/wgpu need the X11, Wayland and xkbcommon headers to build on Linux.
      # Mesa's lavapipe gives us a software Vulkan device so renderer tests are not
      # skipped on a headless runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev mesa-vulkan-drivers vulkan-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Mobile is in scope from M1 per ROADMAP §3.6 even though the ports ship at M22.
  # Checking the arm64 mobile targets on every commit is what keeps that honest: a
  # desktop-only assumption fails here the day it is introduced, not at M22.
  mobile-targets:
    name: Mobile target check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            runner: macos-latest
          - target: aarch64-linux-android
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}
