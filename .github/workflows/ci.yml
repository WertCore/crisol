name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test262_sample:
        description: >-
          How many test262 cases to attempt. Empty runs the whole corpus, which is roughly five
          hours of compiling and linking and will hit the job's ceiling — a number is the
          useful choice unless the wait is the point.
        required: false
        default: '1500'

# One run per ref. A push to a branch with an open pull request fires **two** workflows — the
# `push` (or `pull_request`) event and any manual dispatch — and each spawns the whole matrix.
# Sixteen concurrent jobs was enough for the runners to be reclaimed mid-run, which surfaces as
# `exit code 143` and a shutdown signal rather than anything about the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `budget_mib` is per platform because the three do not measure the same quantity.
          # macOS reports `phys_footprint`, Linux `VmRSS`, Windows `PrivateUsage` — VmRSS
          # counts shared pages the other two discount, which is why Linux reads about three
          # times macOS for the identical run and why one shared ceiling would be meaningless.
          #
          # Each is roughly 2x the reading observed on 13 Sep 2026, which catches a regression
          # that doubles the floor while leaving room for runner variance. One sample is a
          # weak basis for a tight bound, so this is deliberately loose; tighten it when there
          # are enough runs to know the spread.
          - name: macOS (arm64)
            os: macos-latest
            budget_mib: 10 # observed 4.6 (phys_footprint)
          - name: Linux (x86_64)
            os: ubuntu-latest
            budget_mib: 28 # observed 13.5 (VmRSS)
          # **Here to separate "Linux" from "x86-64" in D-142.** The collector fails on
          # `Linux (x86_64)` and passes on `macOS (arm64)`, which are two differences at once —
          # the operating system and the architecture. This job holds the architecture fixed
          # against macOS and the system fixed against x86-64, so whichever way it lands names
          # the variable. Free for public repositories, and cheaper than reproducing it in a
          # local VM, which filled a laptop's disk before it finished.
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            budget_mib: 28 # same counter as x86-64; no separate reading yet
            # **Known red, and kept that way deliberately** (D-144). Frame pointers fixed
            # x86-64 and changed nothing here, so this target has a second fault of its own.
            # Deleting the job would hide it and leaving it blocking would make every run red
            # for something already understood and recorded — so it reports without failing
            # the build, and the day it goes green this line comes out.
            allow_failure: true
          - name: Windows (x86_64)
            os: windows-latest
            budget_mib: 8 # observed 3.4 (PrivateUsage)
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v4

      # winit/wgpu need the X11, Wayland and xkbcommon headers to build on Linux.
      # Mesa's lavapipe gives us a software Vulkan device so renderer tests are not
      # skipped on a headless runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev mesa-vulkan-drivers vulkan-tools \
            fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # §M10's acceptance is "a real `node_modules` tree containing React", and *real* is the
      # load-bearing word: what makes it an acceptance is `exports` maps, conditions, CJS entry
      # points and a dependency in another package, laid out the way npm actually lays them
      # out. A committed fixture would satisfy the sentence and test nothing.
      #
      # Installed rather than vendored for the same reason, and pinned rather than floating so
      # that a React release cannot turn a green branch red without a commit.
      - name: Fetch a real React tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/react-tree"
          mkdir -p "$root"
          cd "$root"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --loglevel=error react@19.2.8 react-dom@19.2.8
          echo "CRISOL_NODE_MODULES_ROOT=$root" >> "$GITHUB_ENV"

      # §M12's acceptance is a test262 pass rate, and the harness that will measure it has to
      # be checked against the *real* corpus — a hand-written frontmatter parser that works on
      # a sample and mis-reads one unusual file would quietly shrink the denominator.
      #
      # Linux only, and sparse. The full suite is a large checkout for a step that currently
      # validates a parser rather than running anything, so paying for it on three platforms
      # would be cost without a corresponding guarantee. When there is an execution engine
      # (M13) this should widen to every platform, because a pass rate is per-target.
      - name: Fetch the test262 subset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/test262"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/tc39/test262.git "$root"
          cd "$root"
          git sparse-checkout set harness \
            test/built-ins/Object test/built-ins/Array test/built-ins/String \
            test/built-ins/Number test/built-ins/Boolean test/built-ins/Symbol \
            test/built-ins/Map test/built-ins/Set test/built-ins/Date \
            test/built-ins/Error test/built-ins/RegExp test/built-ins/JSON \
            test/built-ins/Promise test/built-ins/Proxy test/built-ins/Reflect
          echo "CRISOL_TEST262_ROOT=$root" >> "$GITHUB_ENV"
          echo "CRISOL_REQUIRE_TEST262=1" >> "$GITHUB_ENV"
          # A smoke sample here, not a measurement. Every case that compiles costs a `cc`
          # invocation, so this step gets slower each time something stops being refused — and
          # it is sharing a job with checks that should stay fast. The `test262` job below
          # takes the real reading with a timeout that suits it.
          echo "CRISOL_TEST262_SAMPLE=40" >> "$GITHUB_ENV"

      # **`cargo test` does not build a `staticlib`.** The test262 runner links compiled
      # programs against `libcrisol_abi.a`, which only `cargo build` emits — so the suite has
      # been asserting its absence on every Linux run since `CRISOL_REQUIRE_TEST262` was
      # added. It passed locally because a developer runs `cargo build -p crisol-abi` by habit
      # before testing, which is precisely the difference a CI job exists to catch.
      - name: Build the runtime archive
        run: cargo build -p crisol-abi

      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Without these, a machine missing a GPU adapter or a font *skips* the tests that
          # need them, and a run where everything skipped is indistinguishable from a run
          # where everything passed. Linux gets its adapter from the lavapipe software
          # rasteriser and its fonts from the package installed above.
          CRISOL_REQUIRE_GPU: 1
          CRISOL_REQUIRE_FONTS: 1
          # Same argument, for the same reason: the step above fetched the tree, so an absent
          # one here is a broken workflow rather than a machine without npm.
          CRISOL_REQUIRE_NODE_MODULES: 1

      # `cargo test` builds examples but never runs them, so the interaction paths — key
      # handling, selection, the edit/commit cycle — would compile on three platforms and be
      # executed on none. The headless mode needs no window and no adapter.
      - name: Run the example headless
        # `measure` is added here and nowhere else: it is off by default because an embedder
        # has no use for it, but this is the run that produces the acceptance figure, and CI
        # is the only place all three platforms are available.
        #
        # The reading goes to the job summary rather than only to the log. M8's acceptance is
        # a memory number the product claim rests on, and a number nobody can find without
        # opening three logs and scrolling is not a defensible one.
        #
        # Gated on a per-platform ceiling, set from the readings these three jobs produced
        # rather than guessed ahead of them — see `budget_mib` in the matrix for why one
        # shared number would not mean anything.
        shell: bash
        run: |
          set -euo pipefail
          output=$(cargo run -p crisol-ui --example todo --features measure -- --headless)
          echo "$output"
          # Anchored on a digit after "run: ". A plain substring search also matches this
          # script's own text, which the runner echoes into the same log — the grep finds
          # the instrument instead of the measurement.
          reading=$(grep -oE 'memory after the scripted run: [0-9.]+ MiB \([A-Za-z_]+\)' <<<"$output" \
            | head -1 | sed 's/.*run: //' || true)
          # One job, one summary, so this is a line rather than a row in a table that
          # would have no header to render against.
          echo "**$PLATFORM** idle memory: ${reading:-no reading}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$reading" ]; then
            echo "::error::No memory reading in the headless run's output."
            exit 1
          fi
          mib=${reading%% *}
          # `awk` rather than `[ ]`, which cannot compare decimals.
          if awk -v m="$mib" -v b="$BUDGET_MIB" 'BEGIN { exit !(m > b) }'; then
            echo "::error::Idle memory $reading is over the ${BUDGET_MIB} MiB budget for $PLATFORM."
            exit 1
          fi
          echo "$reading is within the ${BUDGET_MIB} MiB budget for $PLATFORM."
        env:
          CRISOL_REQUIRE_FONTS: 1
          # Through the environment rather than interpolated into the script. These values
          # are the workflow's own literals today, so this is hygiene rather than a fix —
          # it is what keeps the step safe if the matrix ever grows a computed entry.
          PLATFORM: ${{ matrix.name }}
          BUDGET_MIB: ${{ matrix.budget_mib }}

      # M8's acceptance, and so §7's first kill criterion. Separate from the step above
      # because it is a different claim: that one is the engine idling, this one is an
      # application with a 5 MB JSON response loaded, and the 60 MB ceiling is ROADMAP
      # §M8's number rather than a per-platform observation — so it is written here rather
      # than carried in the matrix.
      - name: Measure the acceptance
        shell: bash
        run: |
          set -euo pipefail
          output=$(cargo run -p crisol-ui --example apiclient --features measure -- --headless)
          echo "$output"
          # Anchored on a digit after "ACCEPTANCE: " for the same reason as the step above:
          # this script's own text is echoed into the log, and a looser pattern finds the
          # instrument rather than the measurement.
          reading=$(grep -oE 'ACCEPTANCE: [0-9.]+ MiB \([A-Za-z_]+\)' <<<"$output" \
            | head -1 | sed 's/.*ACCEPTANCE: //' || true)
          echo "**$PLATFORM** acceptance, 5 MB response loaded: ${reading:-no reading}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$reading" ]; then
            echo "::error::No acceptance reading in the apiclient run's output."
            exit 1
          fi
          mib=${reading%% *}
          if awk -v m="$mib" -v b="$ACCEPTANCE_MIB" 'BEGIN { exit !(m > b) }'; then
            echo "::error::Acceptance $reading is over the ${ACCEPTANCE_MIB} MiB budget. ROADMAP §7's first kill criterion says re-evaluate rather than tune."
            exit 1
          fi
          echo "$reading is within the ${ACCEPTANCE_MIB} MiB acceptance budget."
        env:
          CRISOL_REQUIRE_FONTS: 1
          PLATFORM: ${{ matrix.name }}
          ACCEPTANCE_MIB: 60

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Mobile is in scope from M1 per ROADMAP §3.6 even though the ports ship at M22.
  # Checking the arm64 mobile targets on every commit is what keeps that honest: a
  # desktop-only assumption fails here the day it is introduced, not at M22.
  mobile-targets:
    name: Mobile target check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            runner: macos-latest
          - target: aarch64-linux-android
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add target
        # Not the setup action's `targets:` input: that installs the target for `stable`,
        # while `rust-toolchain.toml` pins the toolchain cargo actually uses. `rustup target
        # add` here resolves against the pinned toolchain, which is the one that needs it.
        run: rustup target add ${{ matrix.target }}

      # GameActivity (DECISIONS D-16) compiles C++ glue, so an Android build needs the NDK's
      # cross compiler and not just the Rust target. The NDK is preinstalled on the runner;
      # `cc-rs` just cannot find it without being told where.
      - name: Point the C toolchain at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ]; then
            echo "::error::No Android NDK on this runner (ANDROID_NDK_LATEST_HOME unset)."
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # API 26 is a build-time header level, not a shipping decision: Vulkan needs 24+,
          # and the real minSdk is settled at M22 when there is something to ship.
          cc="$bin/aarch64-linux-android26-clang"
          if [ ! -x "$cc" ]; then
            echo "::error::$cc is missing. Available wrappers:"
            ls "$bin" | grep -E '^aarch64-linux-android[0-9]+-clang$' || true
            exit 1
          fi
          {
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=${cc}++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}

  # `rust-version` was declared for a year and never verified: every job above uses `stable`,
  # so nothing ever confirmed the workspace builds on the floor it advertises. An unverified
  # MSRV is indistinguishable from a false one — the same argument as `CRISOL_REQUIRE_GPU`,
  # where a skipped test and a passing test look alike.
  #
  # `check` rather than `test`: the claim is that the crates *compile* on the floor. Running
  # the suite there would also exercise dev-dependencies, which are not part of the promise an
  # embedder cares about and would raise the floor for a reason nobody asked for.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared floor
        id: floor
        shell: bash
        # Read from Cargo.toml rather than repeated here, so the job cannot drift from the
        # number it is supposed to be checking.
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared floor: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared floor
        run: cargo check --workspace --all-features

  # A job of its own, because this is the only thing here whose cost grows as the engine
  # improves: a refused case costs milliseconds and a compiled one costs a compile and a link.
  # Sharing a job with the fast checks meant either a timeout or a sample too small to mean
  # anything, so it gets its own runner and its own budget.
  test262:
    name: test262 (full corpus)
    # **Not on every push.** The corpus is a compile and a link per case, and the matrix job
    # already carries a sample of 40 as a smoke check. Running the full thing on each commit
    # was most of the load that got the runners reclaimed — it belongs on `main` and on
    # request, where somebody is actually going to read the number.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch the test262 corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/test262"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/tc39/test262.git "$root"
          cd "$root"
          git sparse-checkout set harness \
            test/built-ins/Object test/built-ins/Array test/built-ins/String \
            test/built-ins/Number test/built-ins/Boolean test/built-ins/Symbol \
            test/built-ins/Map test/built-ins/Set test/built-ins/Date \
            test/built-ins/Error test/built-ins/RegExp test/built-ins/JSON \
            test/built-ins/Promise test/built-ins/Proxy test/built-ins/Reflect
          echo "CRISOL_TEST262_ROOT=$root" >> "$GITHUB_ENV"
          echo "CRISOL_REQUIRE_TEST262=1" >> "$GITHUB_ENV"

      - name: Build the runtime archive
        run: cargo build -p crisol-abi

      # **A large sample, not the whole corpus, by default.** Every case is a compile and a
      # link; twelve thousand of them is about five hours, which is past the ceiling above, and
      # a job that times out reports nothing at all. Fifteen hundred is enough for the
      # proportions to mean something and finishes inside the budget. The dispatch input takes
      # a different number, or an empty one for all of them.
      - name: Run the corpus
        shell: bash
        env:
          CRISOL_TEST262_SAMPLE: ${{ inputs.test262_sample }}
          CRISOL_TEST262_ALL: ${{ inputs.test262_sample == '' && '1' || '' }}
        run: |
          set -euo pipefail
          # `tee` so the numbers survive into the next step. Without it the summary would have
          # to re-run the suite to report on it, which is an hour to say the same thing twice.
          cargo test -p crisol --test test262 -- --nocapture | tee "$RUNNER_TEMP/test262.log"

      - name: Publish the numbers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test262.log"
          {
            echo "## test262"
            if [ -f "$log" ]; then
              # The counts and the reason breakdown, which is the part worth reading — a pass
              # rate says how much and the reasons say what to do next.
              sed -n '/attempted of/,$p' "$log" | head -60
            else
              echo "no log: the run did not get far enough to produce one"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-log
          path: ${{ runner.temp }}/test262.log
          if-no-files-found: warn
