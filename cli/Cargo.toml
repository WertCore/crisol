[package]
name = "crisol"
description = "The Crisol command line: build, dev, run, check, package, doctor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# A library as well as a binary, so the acceptance test can call the pipeline directly.
name = "crisol"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "crisol"
path = "src/main.rs"

[dependencies]
crisol-codegen.workspace = true
crisol-frontend.workspace = true
crisol-ir.workspace = true
crisol-value.workspace = true
crisol-render-wgpu.workspace = true
clap.workspace = true
wgpu.workspace = true
